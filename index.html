<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDeebka | Enterprise Security Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyberDark: '#0a0f1d',
                        cyberCard: '#111827',
                        cyberBorder: '#1f293d',
                        cyberGreen: '#00ff66',
                        cyberBlue: '#00e5ff'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Manifest Link -->
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-cyberDark text-gray-100 font-sans min-h-screen flex flex-col selection:bg-cyberGreen selection:text-black">

    <!-- Top Header Navbar -->
    <header class="bg-cyberCard border-b border-cyberBorder sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3 space-x-reverse">
            <button onclick="toggleSidebar()" class="w-10 h-10 rounded-xl bg-cyberBorder/50 flex items-center justify-center text-cyberGreen hover:bg-cyberBorder transition">
                <i class="fa-solid fa-bars text-base"></i>
            </button>
            <div class="flex items-center space-x-2 space-x-reverse">
                <div class="w-8 h-8 rounded-lg bg-cyberGreen/10 border border-cyberGreen/30 flex items-center justify-center text-cyberGreen">
                    <i class="fa-solid fa-shield-halved text-sm"></i>
                </div>
                <h1 class="text-sm font-black tracking-wide text-white">Cyber<span class="text-cyberGreen">Deebka</span></h1>
            </div>
        </div>
        <div class="flex items-center space-x-2 space-x-reverse">
            <span class="text-[10px] bg-cyberGreen/10 text-cyberGreen border border-cyberGreen/30 px-2.5 py-1 rounded-full font-mono font-bold">PRO v4.8</span>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/70 z-50 hidden transition-opacity"></div>

    <!-- Sidebar Drawer -->
    <aside id="sidebar" class="fixed top-0 right-0 bottom-0 w-72 bg-cyberCard border-l border-cyberBorder z-50 transform translate-x-full transition-transform duration-300 flex flex-col justify-between p-5">
        <div>
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-cyberBorder">
                <div class="flex items-center space-x-2 space-x-reverse">
                    <div class="w-9 h-9 rounded-xl bg-cyberGreen/10 border border-cyberGreen/30 flex items-center justify-center text-cyberGreen">
                        <i class="fa-solid fa-user-shield text-sm"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-black text-white">مـيـنا رزق الله</h3>
                        <span class="text-[10px] text-cyberGreen font-mono">Cyber Security Lead</span>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <nav class="space-y-1.5 text-xs">
                <a href="#" onclick="switchTab('home'); toggleSidebar();" class="flex items-center space-x-3 space-x-reverse px-3.5 py-3 rounded-xl hover:bg-cyberBorder/50 text-gray-300 hover:text-cyberGreen transition">
                    <i class="fa-solid fa-house w-5 text-center text-cyberGreen"></i>
                    <span class="font-bold">الرئيسية وغرفة العمليات</span>
                </a>
                <a href="#" onclick="switchTab('mobile'); toggleSidebar();" class="flex items-center space-x-3 space-x-reverse px-3.5 py-3 rounded-xl hover:bg-cyberBorder/50 text-gray-300 hover:text-cyberBlue transition">
                    <i class="fa-solid fa-mobile-screen w-5 text-center text-cyberBlue"></i>
                    <span class="font-bold">أدوات الهاتف الميدانية</span>
                </a>
                <a href="#" onclick="switchTab('pc'); toggleSidebar();" class="flex items-center space-x-3 space-x-reverse px-3.5 py-3 rounded-xl hover:bg-cyberBorder/50 text-gray-300 hover:text-cyberGreen transition">
                    <i class="fa-solid fa-desktop w-5 text-center text-cyberGreen"></i>
                    <span class="font-bold">أدوات الكمبيوتر المتقدمة</span>
                </a>
                <a href="#" onclick="switchTab('wallet'); toggleSidebar();" class="flex items-center space-x-3 space-x-reverse px-3.5 py-3 rounded-xl hover:bg-cyberBorder/50 text-gray-300 hover:text-yellow-400 transition">
                    <i class="fa-solid fa-wallet w-5 text-center text-yellow-400"></i>
                    <span class="font-bold">محفظة الباقات والاشتراكات</span>
                </a>
                <a href="#" onclick="switchTab('stats'); toggleSidebar();" class="flex items-center space-x-3 space-x-reverse px-3.5 py-3 rounded-xl hover:bg-cyberBorder/50 text-gray-300 hover:text-purple-400 transition">
                    <i class="fa-solid fa-chart-line w-5 text-center text-purple-400"></i>
                    <span class="font-bold">إحصائيات الاستخدام والنشاط</span>
                </a>
                <a href="#" onclick="switchTab('support'); toggleSidebar();" class="flex items-center space-x-3 space-x-reverse px-3.5 py-3 rounded-xl hover:bg-cyberBorder/50 text-gray-300 hover:text-cyan-400 transition">
                    <i class="fa-solid fa-headset w-5 text-center text-cyan-400"></i>
                    <span class="font-bold">الدعم الفني وغرفة العمليات</span>
                </a>
                <a href="#" onclick="switchTab('profile'); toggleSidebar();" class="flex items-center space-x-3 space-x-reverse px-3.5 py-3 rounded-xl hover:bg-cyberBorder/50 text-gray-300 hover:text-gray-100 transition">
                    <i class="fa-solid fa-user-gear w-5 text-center text-gray-400"></i>
                    <span class="font-bold">إعدادات الحساب والأمان</span>
                </a>
            </nav>
        </div>

        <div class="border-t border-cyberBorder pt-4 text-center">
            <span class="text-[10px] text-gray-500 font-mono">CyberDeebka Suite © 2026</span>
        </div>
    </aside>

    <!-- Main Content Container -->
    <main id="mainContent" class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 pb-24">
        <!-- Dynamically populated by script.js -->
    </main>

    <!-- Tool Modal Popup -->
    <div id="toolModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cyberCard border border-cyberBorder rounded-2xl w-full max-w-lg p-5 shadow-2xl relative">
            <div class="flex justify-between items-center pb-3 border-b border-cyberBorder mb-4">
                <h3 id="modalToolTitle" class="text-xs font-black text-white flex items-center">تشغيل الأداة</h3>
                <button onclick="closeToolModal()" class="text-gray-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <div id="modalToolBody" class="space-y-4">
                <!-- Dynamic tool execution content -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bg-cyberCard border-t border-cyberBorder fixed bottom-0 left-0 right-0 z-30 px-4 py-2.5 flex justify-around items-center shadow-lg">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center text-cyberGreen transition transform -translate-y-2">
            <i class="fa-solid fa-house text-base mb-1"></i>
            <span class="text-[10px] font-bold">الرئيسية</span>
        </button>
        <button onclick="switchTab('mobile')" id="nav-mobile" class="nav-btn flex flex-col items-center text-gray-400 hover:text-cyberBlue transition">
            <i class="fa-solid fa-mobile-screen text-base mb-1"></i>
            <span class="text-[10px] font-bold">الهاتف</span>
        </button>
        <button onclick="switchTab('pc')" id="nav-pc" class="nav-btn flex flex-col items-center text-gray-400 hover:text-cyberGreen transition">
            <i class="fa-solid fa-desktop text-base mb-1"></i>
            <span class="text-[10px] font-bold">الكمبيوتر</span>
        </button>
        <button onclick="switchTab('wallet')" id="nav-wallet" class="nav-btn flex flex-col items-center text-gray-400 hover:text-yellow-400 transition">
            <i class="fa-solid fa-wallet text-base mb-1"></i>
            <span class="text-[10px] font-bold">الباقات</span>
        </button>
        <button onclick="switchTab('support')" id="nav-support" class="nav-btn flex flex-col items-center text-gray-400 hover:text-cyan-400 transition">
            <i class="fa-solid fa-headset text-base mb-1"></i>
            <span class="text-[10px] font-bold">الدعم</span>
        </button>
    </nav>

    <!-- External JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
