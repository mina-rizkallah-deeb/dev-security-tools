<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDeebka | Enterprise Security Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        corpBg: '#090d16',
                        corpCard: '#111827',
                        corpBorder: '#1f293d',
                        corpText: '#e5e7eb',
                        corpMuted: '#9ca3af',
                        corpAccent: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-corpBg text-corpText font-sans min-h-screen flex flex-col selection:bg-corpAccent selection:text-white">

    <!-- Auth / Onboarding Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-corpCard border border-corpBorder rounded-xl w-full max-w-md p-6 shadow-xl relative">
            <div class="text-center mb-5">
                <div class="w-12 h-12 bg-corpBorder rounded-lg mx-auto flex items-center justify-center text-corpAccent text-xl mb-3">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-base font-bold text-white">تسجيل الدخول وتأكيد الملكية</h2>
                <p class="text-xs text-corpMuted mt-1">أدخل بياناتك الشخصية لحفظ الملكية وتفعيل التحويلات المالية.</p>
            </div>

            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3.5 text-xs">
                <div>
                    <label class="block text-corpMuted mb-1">الاسم الكامل:</label>
                    <input type="text" id="authName" required value="مينا رزق الله" class="w-full bg-corpBg border border-corpBorder rounded-lg p-2.5 text-white focus:outline-none focus:border-corpAccent">
                </div>
                <div>
                    <label class="block text-corpMuted mb-1">البريد الإلكتروني:</label>
                    <input type="email" id="authEmail" required placeholder="name@company.sec" class="w-full bg-corpBg border border-corpBorder rounded-lg p-2.5 text-white focus:outline-none focus:border-corpAccent">
                </div>
                <div>
                    <label class="block text-corpMuted mb-1">كلمة المرور:</label>
                    <input type="password" id="authPass" required placeholder="••••••••••••" class="w-full bg-corpBg border border-corpBorder rounded-lg p-2.5 text-white focus:outline-none focus:border-corpAccent">
                </div>
                <div>
                    <label class="block text-corpMuted mb-1">رقم المحفظة (فودافون كاش):</label>
                    <input type="text" id="authWallet" required placeholder="010xxxxxxxx" class="w-full bg-corpBg border border-corpBorder rounded-lg p-2.5 text-white focus:outline-none focus:border-corpAccent">
                </div>
                <button type="submit" class="w-full bg-corpAccent text-white font-semibold py-3 rounded-lg hover:bg-blue-600 transition mt-2">
                    حفظ البيانات وبدء النظام
                </button>
            </form>
        </div>
    </div>

    <!-- Top Header -->
    <header class="bg-corpCard border-b border-corpBorder sticky top-0 z-30 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3 space-x-reverse">
            <button onclick="toggleSidebar()" class="w-9 h-9 rounded-lg bg-corpBg border border-corpBorder flex items-center justify-center text-corpMuted hover:text-white transition">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
            <div class="flex items-center space-x-2 space-x-reverse">
                <h1 class="text-xs font-bold text-white tracking-wide">Cyber<span class="text-corpAccent">Deebka</span> <span class="text-[10px] text-corpMuted font-normal">Enterprise</span></h1>
            </div>
        </div>
        <div class="flex items-center space-x-2 space-x-reverse">
            <span id="headerUserName" class="text-xs text-corpMuted">مينا رزق الله</span>
            <div class="w-7 h-7 rounded-full bg-corpBorder flex items-center justify-center text-corpAccent text-xs font-bold">م</div>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden"></div>

    <!-- Sidebar Drawer -->
    <aside id="sidebar" class="fixed top-0 right-0 bottom-0 w-72 bg-corpCard border-l border-corpBorder z-50 transform translate-x-full transition-transform duration-200 flex flex-col justify-between p-4">
        <div>
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-corpBorder">
                <div class="flex items-center space-x-2 space-x-reverse">
                    <div class="w-8 h-8 rounded-lg bg-corpBg border border-corpBorder flex items-center justify-center text-corpAccent text-xs font-bold">م</div>
                    <div>
                        <h3 id="sidebarName" class="text-xs font-bold text-white">مينا رزق الله</h3>
                        <span class="text-[10px] text-corpMuted">حساب مؤسسي موثق</span>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="text-corpMuted hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <nav class="space-y-1 text-xs">
                <a href="#" onclick="switchTab('profile'); toggleSidebar();" class="flex items-center space-x-2.5 space-x-reverse px-3 py-2.5 rounded-lg hover:bg-corpBg text-corpMuted hover:text-white transition">
                    <i class="fa-solid fa-user w-4 text-center"></i>
                    <span>الملف الشخصي وتأكيد الملكية</span>
                </a>
                <a href="#" onclick="switchTab('about'); toggleSidebar();" class="flex items-center space-x-2.5 space-x-reverse px-3 py-2.5 rounded-lg hover:bg-corpBg text-corpMuted hover:text-white transition">
                    <i class="fa-solid fa-circle-info w-4 text-center"></i>
                    <span>نبذة عن المنظومة</span>
                </a>
                <a href="#" onclick="switchTab('faq'); toggleSidebar();" class="flex items-center space-x-2.5 space-x-reverse px-3 py-2.5 rounded-lg hover:bg-corpBg text-corpMuted hover:text-white transition">
                    <i class="fa-solid fa-circle-question w-4 text-center"></i>
                    <span>الأسئلة الشائعة (FAQ)</span>
                </a>
                <a href="#" onclick="switchTab('language'); toggleSidebar();" class="flex items-center space-x-2.5 space-x-reverse px-3 py-2.5 rounded-lg hover:bg-corpBg text-corpMuted hover:text-white transition">
                    <i class="fa-solid fa-globe w-4 text-center"></i>
                    <span>لغة النظام (العربية)</span>
                </a>
                <div class="pt-2 border-t border-corpBorder mt-2">
                    <button onclick="logoutApp()" class="w-full flex items-center space-x-2.5 space-x-reverse px-3 py-2.5 rounded-lg hover:bg-red-500/10 text-red-400 transition font-medium">
                        <i class="fa-solid fa-right-from-bracket w-4 text-center"></i>
                        <span>تسجيل الخروج</span>
                    </button>
                </div>
            </nav>
        </div>
        <div class="border-t border-corpBorder pt-3 text-center">
            <span class="text-[10px] text-corpMuted font-mono">CyberDeebka Suite v5.0</span>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="mainContent" class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-5 pb-24">
        <!-- Dynamic Content -->
    </main>

    <!-- Tool Execution Modal -->
    <div id="toolModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-corpCard border border-corpBorder rounded-xl w-full max-w-lg p-4 shadow-xl relative">
            <div class="flex justify-between items-center pb-2.5 border-b border-corpBorder mb-3">
                <h3 id="modalToolTitle" class="text-xs font-bold text-white">تشغيل الأداة</h3>
                <button onclick="closeToolModal()" class="text-corpMuted hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <div id="modalToolBody" class="space-y-3"></div>
        </div>
    </div>

    <!-- Clean Corporate Bottom Navigation Bar -->
    <nav class="bg-corpCard border-t border-corpBorder fixed bottom-0 left-0 right-0 z-20 px-2 py-2 flex justify-around items-center max-w-lg mx-auto">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center text-corpMuted hover:text-white transition py-1 px-2">
            <i class="fa-solid fa-house text-sm mb-1"></i>
            <span class="text-[10px]">الرئيسية</span>
        </button>
        <button onclick="switchTab('mobile')" id="nav-mobile" class="nav-btn flex flex-col items-center text-corpMuted hover:text-white transition py-1 px-2">
            <i class="fa-solid fa-mobile-screen text-sm mb-1"></i>
            <span class="text-[10px]">الهاتف</span>
        </button>
        <button onclick="switchTab('pc')" id="nav-pc" class="nav-btn flex flex-col items-center text-corpMuted hover:text-white transition py-1 px-2">
            <i class="fa-solid fa-computer text-sm mb-1"></i>
            <span class="text-[10px]">الكمبيوتر</span>
        </button>
        <button onclick="switchTab('wallet')" id="nav-wallet" class="nav-btn flex flex-col items-center text-corpMuted hover:text-white transition py-1 px-2">
            <i class="fa-solid fa-wallet text-sm mb-1"></i>
            <span class="text-[10px]">المحفظة</span>
        </button>
        <button onclick="toggleSidebar()" class="flex flex-col items-center text-corpMuted hover:text-white transition py-1 px-2">
            <i class="fa-solid fa-bars text-sm mb-1"></i>
            <span class="text-[10px]">القائمة</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
